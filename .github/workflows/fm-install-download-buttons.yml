name: FIGURAMASTER downloads install once
on:
  push:
    paths:
      - '.github/workflows/fm-install-download-buttons.yml'
permissions:
  contents: write
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install download buttons without changing counters or audio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('index.html')
          s=p.read_text('utf-8')
          assert len(s)>6000000, 'Unexpectedly small Atlas'
          assert 'FIGURAMASTER_DOWNLOAD_PERMISSIONS_START' not in s, 'Buttons are already installed'
          assert s.count('id="fm-engagement-js"')==1, 'Counters must be preserved'
          m=re.search(r'const audioFiles=(\{[^;]+\});\s*const audioElement=',s)
          assert m, 'Audio catalog not found'
          audio=json.loads(m.group(1))
          assert len(audio)==15 and audio.get('Эверест 2026')=='everest-2026.mp3', 'Unexpected catalog'
          flags={v:False for v in audio.values()}
          block=('/* FIGURAMASTER_DOWNLOAD_PERMISSIONS_START */\n'
                 'const fmDownloadPermissions='+json.dumps(flags,ensure_ascii=False,separators=(',',':'))+';\n'
                 '/* FIGURAMASTER_DOWNLOAD_PERMISSIONS_END */\n')
          assert s.count('function render(){')==1
          s=s.replace('function render(){',block+'function render(){',1)
          css='''<style id="fm-download-css">
          /* FIGURAMASTER 0.3: download links allowed only by the private manager. */
          .actions .fm-download-btn{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:34px;min-width:0;padding:7px 11px;border-radius:7px;font:600 11px/1.25 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.015em;text-decoration:none;white-space:nowrap;transition:background .16s,border-color .16s}
          .actions a.fm-download-btn{background:#3f5d35;border:1px solid #8fa574;color:#f2f3df;box-shadow:inset 0 1px rgba(255,255,255,.09)}
          .actions a.fm-download-btn:hover{background:#526f44;border-color:#c4d7a2}
          .actions .fm-download-btn:focus-visible{outline:2px solid #e9d29a;outline-offset:2px}
          .actions button.fm-download-btn:disabled{background:#24342d;border:1px solid #41584a;color:#819c8b;opacity:.75;cursor:not-allowed;box-shadow:none}
          @media(max-width:590px){.release .actions .fm-download-btn{min-height:30px;padding:6px 8px;font-size:10px}}
          </style>'''
          assert s.count('</head>')==1
          s=s.replace('</head>',css+'</head>',1)
          insert='''    const downloadFile=audioFiles[t.name];
              const canDownload=!!(downloadFile&&fmDownloadPermissions[downloadFile]===true);
              const downloadHTML=canDownload
                ?`<a class="fm-download-btn" href="audio/__DOLLAR__{encodeURIComponent(downloadFile)}" download="__DOLLAR__{escapeHTML(downloadFile)}" aria-label="Скачать __DOLLAR__{title} в MP3">↓ Скачать MP3</a>`
                :`<button type="button" class="fm-download-btn" disabled title="Скачивание закрыто владельцем Атласа" aria-label="Скачивание __DOLLAR__{title} пока недоступно">↓ Скачать MP3</button>`;
          '''.replace('__DOLLAR__','$')
          assert s.count('    const nameHTML=vkAvailable')==1
          s=s.replace('    const nameHTML=vkAvailable',insert+'    const nameHTML=vkAvailable',1)
          old='</button>__DOLLAR__{vkHTML}<span class="label">FIGURAMASTER</span></div></div></article>`;'.replace('__DOLLAR__','$')
          new='</button>__DOLLAR__{vkHTML}__DOLLAR__{downloadHTML}<span class="label">FIGURAMASTER</span></div></div></article>`;'.replace('__DOLLAR__','$')
          assert s.count(old)==1, 'Card template changed; no edits made'
          s=s.replace(old,new,1)
          assert s.count('FIGURAMASTER_DOWNLOAD_PERMISSIONS_START')==1
          assert s.count('const tracks=')==1 and s.count('const audioFiles=')==1
          assert s.count('id="fm-engagement-js"')==1 and 'everest-2026.mp3' in s
          p.write_text(s,'utf-8')
          print('Prepared buttons for',len(flags),'releases; all downloads disabled.')
          PY
      - name: Commit only the updated index.html
        run: |
          git diff --check
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'FIGURAMASTER automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'FIGURAMASTER Atlas 0.3: download buttons off by default'
          git push origin HEAD:main
