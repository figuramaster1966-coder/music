name: Build FIGURAMASTER Android APK

on:
  push:
    branches:
      - figura-android-preview
    paths:
      - 'android/**'
      - '.github/workflows/build-figura-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          echo "Using SDK at ${ANDROID_HOME}"
          SDKMANAGER="$(find \"${ANDROID_HOME}/cmdline-tools\" -type f -name sdkmanager | head -n 1)"
          echo "SDK manager: ${SDKMANAGER}"
          test -n "${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FIGURAMASTER-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
